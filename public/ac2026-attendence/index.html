<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attendance Registration System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <link rel="stylesheet" href="style.css">

  <!-- Firebase Integration -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

<div class="container">

<h2>Attendance Registration</h2>
<form id="form">
  <input type="text" id="name" placeholder="Name" required>
  <input type="email" id="email" placeholder="Email" required>
  <select id="committee" required>
  <option value="">Select Committee</option>
  <option value="IT">IT</option>
  <option value="HR">HR</option>
  <option value="Marketing">QM</option>
  <option value="Operations">Media</option>
  <option value="Operations">Advertising</option>
  <option value="Operations">PR</option>
  <option value="Operations">FR</option>
  <option value="Operations">High Board</option>

</select>
  <button type="submit">Next</button>
</form>

<div id="calendar" class="hidden">
  <h2 id="Selectword">Select Day & Time</h2>


  <select id="dayFilter">
    <option value="All">All Days</option>
  </select>

  <div id="slots"></div>
  <button id="submitBooking">Submit Selection</button>

</div>

</div>
  <p class="footer">Powered By : IT Team 👨🏻‍💻 </p>

<script src="script.js"></script>


</body>
</html>
